name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: 20

      - run: npm ci

      - run: npm run lint

      # Next.js 16 generates route-aware types (LayoutProps, PageProps, etc.)
      # separately from tsc; `next typegen` must run before `tsc --noEmit`.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test
