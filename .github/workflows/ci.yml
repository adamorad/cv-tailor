name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    strategy:
      matrix:
        node-version: [20, 22, 24]
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: ${{ matrix.node-version }}
          cache: "npm"

      - run: npm ci

      - name: npm audit (fails on critical)
        run: npm audit --audit-level=critical

      - run: npm run lint

      # Next.js 16 generates route-aware types (LayoutProps, PageProps, etc.)
      # separately from tsc; `next typegen` must run before `tsc --noEmit`.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

      - name: Coverage (report-only)
        run: npm run test:coverage

      - uses: actions/upload-artifact@v4
        with:
          name: coverage-node-${{ matrix.node-version }}
          path: coverage/

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20
          cache: "npm"

      - run: npm ci

      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
