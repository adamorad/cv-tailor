name: CI

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - name: npm audit (report-only)
        run: npm audit --audit-level=high
        continue-on-error: true

      - run: npm run lint

      # Next.js 16 generates route-aware types (LayoutProps, PageProps, etc.)
      # separately from tsc; `next typegen` must run before `tsc --noEmit`.
      - run: npx next typegen

      - run: npx tsc --noEmit

      - run: npm run build

      - run: npm test

  sbom:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v7

      - uses: actions/setup-node@v7
        with:
          node-version: 20

      - run: npm ci

      - name: Generate SBOM
        run: npx @cyclonedx/cyclonedx-npm --output-file sbom.json

      - uses: actions/upload-artifact@v4
        with:
          name: sbom
          path: sbom.json
