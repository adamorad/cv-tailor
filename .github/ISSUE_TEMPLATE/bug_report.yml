name: Bug report
description: Report a bug or unexpected behavior in CV Tailor
labels: ["bug"]
body:
  - type: textarea
    id: description
    attributes:
      label: Description
      description: A clear and concise description of what the bug is.
    validations:
      required: true

  - type: textarea
    id: steps-to-reproduce
    attributes:
      label: Steps to reproduce
      description: Steps to reproduce the behavior.
      placeholder: |
        1. Go to '...'
        2. Click on '...'
        3. See error
    validations:
      required: true

  - type: textarea
    id: expected-behavior
    attributes:
      label: Expected behavior
      description: What did you expect to happen?
    validations:
      required: true

  - type: textarea
    id: actual-behavior
    attributes:
      label: Actual behavior
      description: What actually happened? Include error messages, logs, or screenshots if available.
    validations:
      required: true

  - type: input
    id: ollama-model
    attributes:
      label: Ollama model
      description: Which Ollama model were you using when this occurred?
      placeholder: e.g. llama3.1:8b
    validations:
      required: true

  - type: dropdown
    id: os
    attributes:
      label: Operating System
      options:
        - macOS
        - Linux
        - Windows
    validations:
      required: true

  - type: input
    id: node-version
    attributes:
      label: Node version
      description: Output of `node -v`
      placeholder: e.g. v20.11.0
    validations:
      required: true

  - type: input
    id: ollama-version
    attributes:
      label: Ollama version
      description: Output of `ollama -v`
      placeholder: e.g. 0.3.6
    validations:
      required: true
